name: Backend Tests

on:
  pull_request:
    branches:
      - integration/mvp
      - main
  push:
    branches:
      - integration/mvp

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: council_brief_test
          POSTGRES_USER: council_brief_test
          POSTGRES_PASSWORD: council_brief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U council_brief_test -d council_brief_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://council_brief_test:council_brief_test@localhost:5432/council_brief_test
      TEST_DATABASE_URL: postgresql+psycopg://council_brief_test:council_brief_test@localhost:5432/council_brief_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
